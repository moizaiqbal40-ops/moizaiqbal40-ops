<svg xmlns="http://www.w3.org/2000/svg" width="320" height="230" viewBox="0 0 320 230" role="img" aria-labelledby="title desc">
  <title id="title">GitHub Activity Overview</title>
  <desc id="desc">Contribution activity distribution: commits, code review, issues and pull requests.</desc>
  <rect width="320" height="230" rx="16" fill="#090D0A"/>
  <g transform="translate(82 115) rotate(-90)">
    <circle r="70" fill="none" stroke="#1F2937" stroke-width="18"/>
    <circle r="70" fill="none" stroke="#39FF88" stroke-width="18" stroke-dasharray="439.82 439.82" stroke-linecap="round"/>
  </g>
  <text x="82" y="110" text-anchor="middle" fill="#9AFF45" font-family="Arial,sans-serif" font-size="25" font-weight="700">100%</text>
  <text x="82" y="130" text-anchor="middle" fill="#CBD5D1" font-family="Arial,sans-serif" font-size="11">COMMITS</text>
  <g font-family="Arial,sans-serif" font-size="13" fill="#CBD5D1">
    <circle cx="178" cy="68" r="5" fill="#39FF88"/><text x="191" y="72">Commits</text><text x="300" y="72" text-anchor="end" fill="#9AFF45" font-weight="700">100%</text>
    <circle cx="178" cy="105" r="5" fill="#86EFAC"/><text x="191" y="109">Code review</text><text x="300" y="109" text-anchor="end" fill="#94A3B8">0%</text>
    <circle cx="178" cy="142" r="5" fill="#4ADE80"/><text x="191" y="146">Pull requests</text><text x="300" y="146" text-anchor="end" fill="#94A3B8">0%</text>
    <circle cx="178" cy="179" r="5" fill="#166534"/><text x="191" y="183">Issues</text><text x="300" y="183" text-anchor="end" fill="#94A3B8">0%</text>
  </g>
</svg>
