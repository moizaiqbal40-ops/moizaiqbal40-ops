<svg width="1600" height="360" viewBox="0 0 1600 360"
     xmlns="http://www.w3.org/2000/svg">

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#F3FBF7"/>
    <stop offset="50%" stop-color="#E6F5ED"/>
    <stop offset="100%" stop-color="#D4EDDF"/>
  </linearGradient>

  <radialGradient id="glow">
    <stop offset="0%" stop-color="#2E9B6D" stop-opacity=".20"/>
    <stop offset="100%" stop-color="#2E9B6D" stop-opacity="0"/>
  </radialGradient>
</defs>

<rect width="1600" height="360" rx="28" fill="url(#bg)"/>

<circle cx="800" cy="180" r="260" fill="url(#glow)"/>

<circle cx="800" cy="180" r="115"
        fill="none"
        stroke="#277A58"
        stroke-opacity=".18"
        stroke-width="1"/>

<circle cx="800" cy="180" r="175"
        fill="none"
        stroke="#277A58"
        stroke-opacity=".10"
        stroke-width="1"/>

<text x="800"
      y="170"
      text-anchor="middle"
      font-family="Inter, Segoe UI, Arial, sans-serif"
      font-size="52"
      font-weight="700"
      letter-spacing="-1"
      fill="#123F2E">
  Software Engineer + AI
</text>

<text x="800"
      y="215"
      text-anchor="middle"
      font-family="Inter, Segoe UI, Arial, sans-serif"
      font-size="15"
      font-weight="500"
      letter-spacing="5"
      fill="#277A58">
  BUILDING · LEARNING · SHIPPING
</text>

</svg>
